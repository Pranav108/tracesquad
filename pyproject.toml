[project]
name = "tracesquad"
version = "0.1.0"
description = "TraceSquad: six bug agents that talk peer to peer, and the mock API they work against"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracesquad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Starlette's TestClient warns that it prefers `httpx2`; httpx still works and is what we depend on.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
