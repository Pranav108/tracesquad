[project]
name = "bugmock"
version = "0.1.0"
description = "Mock data service for the Triage, Telios, Kinetics and Espida bug agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bugmock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
